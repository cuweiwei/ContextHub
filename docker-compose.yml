services:
  contexthub:
    build: .
    image: ${CONTEXTHUB_IMAGE:-contexthub:latest}
    container_name: contexthub
    restart: unless-stopped
    ports:
      # Fail-safe default: publish only on NAS loopback. On Synology, expose
      # this to the tailnet with `tailscale serve --tcp=8788
      # tcp://127.0.0.1:8788`. Control Center uses a separate HTTPS Serve
      # listener, e.g. `tailscale serve --https=8443
      # http://127.0.0.1:8788`; never bind 0.0.0.0 or the NAS public IPv4.
      - "${CONTEXTHUB_BIND_ADDRESS:-127.0.0.1}:${CONTEXTHUB_HOST_PORT:-8788}:8787"
    environment:
      # Generate with: openssl rand -base64 32  (put it in a .env file next to
      # this compose file, or export it in the shell running docker compose)
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_CENTER_ENABLED: ${CONTROL_CENTER_ENABLED:-false}
      CONTROL_CENTER_TAILSCALE_AUTH_ENABLED: ${CONTROL_CENTER_TAILSCALE_AUTH_ENABLED:-false}
      CONTROL_CENTER_TRUSTED_PROXY: ${CONTROL_CENTER_TRUSTED_PROXY:-false}
      CONTROL_CENTER_CANONICAL_ORIGIN: ${CONTROL_CENTER_CANONICAL_ORIGIN:-}
      CONTROL_CENTER_SESSION_IDLE_MINUTES: ${CONTROL_CENTER_SESSION_IDLE_MINUTES:-480}
      CONTROL_CENTER_SESSION_MAX_DAYS: ${CONTROL_CENTER_SESSION_MAX_DAYS:-14}
      CONTROL_CENTER_FRESH_SESSION_MINUTES: ${CONTROL_CENTER_FRESH_SESSION_MINUTES:-5}
      AGENT_ENROLLMENT_ENABLED: ${AGENT_ENROLLMENT_ENABLED:-false}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      LEGACY_API_KEYS_ENABLED: ${LEGACY_API_KEYS_ENABLED:-true}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_AUDIENCE_BASE: ${OAUTH_AUDIENCE_BASE:-}
      OAUTH_JWKS_URI: ${OAUTH_JWKS_URI:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_SIGNING_MASTER_KEY: ${WEBHOOK_SIGNING_MASTER_KEY:-}
      AUDIT_ANCHOR_PATH: ${AUDIT_ANCHOR_PATH:-}
      CONTEXTHUB_ALIAS_FILE: ${CONTEXTHUB_ALIAS_FILE:-}
      TELEGRAM_BOT_TOKEN_FILE: ${TELEGRAM_BOT_TOKEN_FILE:-}
      TELEGRAM_CHAT_ID_FILE: ${TELEGRAM_CHAT_ID_FILE:-}
    volumes:
      # SQLite database lives here — back this folder up.
      - ./data:/data
      # Audit anchors deliberately live outside DATA_DIR and are metadata-only.
      - ${AUDIT_ANCHOR_DIR:-./audit-anchors}:/audit-anchors
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional, independently restartable workers. They are not started by the
  # default profile and never mount the authoritative SQLite data directory.
  github-connector:
    profiles: ["connectors"]
    image: contexthub:latest
    restart: unless-stopped
    command: ["node", "dist/connectors/github-worker-main.js"]
    environment:
      GITHUB_CONNECTOR_CONFIG_FILE: /etc/contexthub/connectors/github.json
      GITHUB_CONNECTOR_TOKEN_FILE: /run/secrets/github-token
    volumes:
      - ./config/connectors/github.json:/etc/contexthub/connectors/github.json:ro
      - ./secrets/github-token:/run/secrets/github-token:ro
      - ./secrets/context-hub-connector-key:/run/secrets/context-hub-connector-key:ro

  google-calendar-connector:
    profiles: ["connectors"]
    image: contexthub:latest
    restart: unless-stopped
    command: ["node", "dist/connectors/google-calendar-worker-main.js"]
    environment:
      GOOGLE_CALENDAR_CONNECTOR_CONFIG_FILE: /etc/contexthub/connectors/google-calendar.json
      GOOGLE_CALENDAR_ACCESS_TOKEN_FILE: /run/secrets/google-calendar-token
    volumes:
      - ./config/connectors/google-calendar.json:/etc/contexthub/connectors/google-calendar.json:ro
      - ./secrets/google-calendar-token:/run/secrets/google-calendar-token:ro
      - ./secrets/context-hub-connector-key:/run/secrets/context-hub-connector-key:ro
