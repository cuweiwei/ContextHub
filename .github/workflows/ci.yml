name: ContextHub CI

on:
  pull_request:
  push:
    branches: [main, codex/p0-backlog]

permissions:
  contents: read

concurrency:
  group: contexthub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository hygiene
        run: npm run hygiene
      - name: Unit and integration tests
        run: npm test
      - name: End-to-end tests
        run: npm run e2e
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Retrieval regression gate
        run: npm run benchmark:retrieval -- --items=2000
      - name: Install Chromium only
        run: npx playwright install chromium
      - name: Browser smoke
        run: npm run test:browser
      - name: Docker build smoke
        run: docker build --build-arg CONTEXTHUB_BUILD_COMMIT=${{ github.sha }} --build-arg CONTEXTHUB_VERSION=$(node -p "require('./package.json').version") -t contexthub:ci .
      - name: Diff and final hygiene
        run: |
          git diff --check
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
