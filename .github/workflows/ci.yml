name: ContextHub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contexthub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cuweiwei/contexthub

jobs:
  core:
    name: Core tests and policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository hygiene
        run: npm run hygiene
      - name: Shell script lint
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -S error scripts/*.sh
      - name: Unit and integration tests
        run: npm test
      - name: End-to-end tests
        run: npm run e2e
      - name: Production dependency audit
        run: npm audit --omit=dev

  retrieval-and-browser:
    name: Retrieval and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Retrieval regression gate
        run: npm run benchmark:retrieval -- --items=2000
      - name: Build browser target
        run: npm run build
      - name: Install Chromium only
        run: npx playwright install chromium
      - name: Browser smoke
        run: npm run test:browser

  container:
    name: Container build, scan and release manifest
    needs: [core, retrieval-and-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Read package version
        id: package-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=ci,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.version=${{ steps.package-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CONTEXTHUB_BUILD_COMMIT=${{ github.sha }}
            CONTEXTHUB_VERSION=${{ steps.package-version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Trivy CVE gate
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: image
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}/{1}:ci', env.REGISTRY, env.IMAGE_NAME) || format('{0}/{1}:sha-{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Prepare SBOM directory
        run: mkdir -p artifacts
      - name: Generate SBOM summary
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: image
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}/{1}:ci', env.REGISTRY, env.IMAGE_NAME) || format('{0}/{1}:sha-{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) }}
          format: cyclonedx
          output: artifacts/contexthub-sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contexthub-sbom-${{ github.run_id }}
          path: artifacts/contexthub-sbom.cyclonedx.json
          if-no-files-found: error
      - name: Generate provenance attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create immutable release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_MANIFEST_OUT: artifacts/release-manifest.json
        run: npm run release:manifest
      - name: Upload release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aihome-release-${{ github.sha }}
          path: artifacts/release-manifest.json
          if-no-files-found: error

  verify:
    name: verify
    if: always()
    needs: [core, retrieval-and-browser, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates to pass
        env:
          CORE: ${{ needs.core.result }}
          RETRIEVAL_BROWSER: ${{ needs.retrieval-and-browser.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$CORE" = success
          test "$RETRIEVAL_BROWSER" = success
          test "$CONTAINER" = success
