name: Retrieval scale gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 6'

permissions:
  contents: read

jobs:
  retrieval-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: 100k retrieval quality and latency gate
        run: npm run benchmark:retrieval -- --items=100000
